spring.application.name=student-management

# Optional: load secrets from a local .env file (never committed to git).
# Copy .env.example -> .env and fill in your values.
spring.config.import=optional:file:.env[.properties]

# ---- Database (MySQL) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# ---- JWT ----
# JWT_SECRET is REQUIRED (min 32 characters). Generate one with: openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# ---- CORS (comma separated list of frontend origins) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- First-run seed data ----
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.seed-demo-data=${SEED_DEMO_DATA:true}
