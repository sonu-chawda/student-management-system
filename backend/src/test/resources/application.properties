# Used only by tests: in-memory H2 database, so no MySQL is needed to run `mvn test`.
spring.application.name=student-management-test
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=test-secret-key-for-unit-tests-only-1234567890
jwt.expiration=3600000

app.cors.allowed-origins=http://localhost:5173
app.admin.username=admin
app.admin.password=Admin@123
app.seed-demo-data=false
